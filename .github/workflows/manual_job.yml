name: Manual Job — Generate CV from URL or Text

on:
  workflow_dispatch:
    inputs:
      job_url:
        description: 'Job posting URL (auto-scrapes title + description — easiest)'
        required: false
        type: string
        default: ''
      job_title:
        description: 'Job title — only needed if NOT using job_url'
        required: false
        type: string
        default: ''
      company:
        description: 'Company name — only needed if NOT using job_url'
        required: false
        type: string
        default: ''
      job_description:
        description: 'Paste job description — only needed if NOT using job_url'
        required: false
        type: string
        default: ''

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libpango-1.0-0 libpangocairo-1.0-0 \
            libgdk-pixbuf2.0-0 libffi-dev shared-mime-info

      - name: Install Python dependencies
        run: |
          pip install requests beautifulsoup4 groq weasyprint playwright
          playwright install chromium
          playwright install-deps

      - name: Generate and send CV
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_URL: ${{ inputs.job_url }}
          JOB_TITLE: ${{ inputs.job_title }}
          COMPANY: ${{ inputs.company }}
          JOB_DESCRIPTION: ${{ inputs.job_description }}
        run: python scraper/manual_job.py
